<!doctype html>
<title>Audio fixture</title>
<button id="play" style="position:absolute;left:100px;top:100px;width:120px;height:40px">Play</button>
<script>
  document.getElementById('play').onclick = () => {
    const ctx = new AudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    gain.gain.value = 0.5;
    osc.connect(gain).connect(ctx.destination);
    osc.start();
  };
</script>
