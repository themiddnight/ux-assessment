<!doctype html>
<title>Save fixture</title>
<textarea id="doc" style="position:absolute;left:100px;top:40px;width:300px;height:40px">hello world</textarea>
<button id="save" style="position:absolute;left:100px;top:100px;width:120px;height:40px">Save</button>
<button id="open" style="position:absolute;left:260px;top:100px;width:120px;height:40px">Open</button>
<p id="status" style="position:absolute;left:100px;top:150px">idle</p>
<script>
  const status = (s) => { document.getElementById('status').textContent = s; };
  document.getElementById('save').onclick = async () => {
    try {
      const h = await showSaveFilePicker({ suggestedName: 'song.json' });
      const w = await h.createWritable();
      await w.write(document.getElementById('doc').value);
      await w.close();
      status('saved ' + h.name);
    } catch (e) { status('save failed: ' + e.name); }
  };
  document.getElementById('open').onclick = async () => {
    try {
      const [h] = await showOpenFilePicker();
      status('opened ' + h.name + ': ' + (await (await h.getFile()).text()));
    } catch (e) { status('open failed: ' + e.name); }
  };
</script>
