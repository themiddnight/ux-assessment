name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
        node: [20]
        include:
          - os: ubuntu-24.04
            node: 22
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: driver/package-lock.json
      - name: Driver dependencies
        working-directory: driver
        run: npm ci
      - name: Thai fonts (Linux screenshots, D17)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-thai-tlwg
      - name: Playwright Chromium
        working-directory: driver
        run: node node_modules/playwright/cli.js install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
      - name: Driver tests
        working-directory: driver
        run: npm test
      - name: Codex CLI from npm
        # @openai/codex's own npm install path prints Node's DEP0040 (punycode) and DEP0169
        # (url.parse) deprecation warnings from its dependency tree, not our code; disable only
        # those two warning codes (never a blanket --no-deprecation), scoped to this step only,
        # so a deprecation warning from our own code still surfaces.
        env:
          NODE_OPTIONS: --disable-warning=DEP0040 --disable-warning=DEP0169
        run: npm install -g @openai/codex@latest
      - name: Locate the native codex binary
        run: echo "UXA_CODEX_BIN=$(node .github/scripts/find-codex-bin.mjs "$(npm root -g)")" >> "$GITHUB_ENV"
      - name: Offline feature gate (no model call)
        run: node driver/codex-runner.mjs self-check --offline
      - name: Installer (Codex skill link with the real CLI; a junction on Windows)
        # Run twice: the second run must find the link and keep it. No --claude step: CI has no Claude sign-in.
        run: |
          node scripts/install.mjs --skip-deps --no-claude
          node scripts/install.mjs --skip-deps --no-claude
          node .github/scripts/check-codex-link.mjs
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Claude marketplace manifest
        run: npx -y @anthropic-ai/claude-code plugin validate .
      - name: Claude plugin manifest
        run: npx -y @anthropic-ai/claude-code plugin validate .claude-plugin/plugin.json
  gitleaks:
    # Not on workflow_dispatch: a manual run has no commit range and would scan the whole history.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        # The action's own Node code prints DEP0040 (punycode) and DEP0169 (url.parse); disable only
        # those two codes, for this step only (see "Codex CLI from npm" above).
        env:
          NODE_OPTIONS: --disable-warning=DEP0040 --disable-warning=DEP0169
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
